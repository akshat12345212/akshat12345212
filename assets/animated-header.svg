<svg width="1200" height="390" viewBox="0 0 1200 390" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="80" y1="20" x2="1120" y2="370" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07101F"/>
      <stop offset="0.5" stop-color="#0D1024"/>
      <stop offset="1" stop-color="#120A21"/>
    </linearGradient>
    <linearGradient id="accent" x1="250" y1="0" x2="950" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE"/>
      <stop offset="0.5" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#EC4899"/>
    </linearGradient>
    <radialGradient id="glowCyan">
      <stop stop-color="#22D3EE" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPurple">
      <stop stop-color="#8B5CF6" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#334155" stroke-opacity="0.18"/>
    </pattern>
    <path id="leftOrbit" d="M210 195a110 110 0 1 0 220 0a110 110 0 1 0-220 0"/>
    <path id="rightOrbit" d="M790 195a105 105 0 1 0 210 0a105 105 0 1 0-210 0"/>
  </defs>

  <rect x="1" y="1" width="1198" height="388" rx="28" fill="url(#bg)" stroke="url(#accent)" stroke-width="2"/>
  <rect x="20" y="20" width="1160" height="350" rx="20" fill="url(#grid)"/>

  <circle cx="180" cy="195" r="170" fill="url(#glowCyan)">
    <animate attributeName="opacity" values="0.55;0.95;0.55" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1020" cy="195" r="170" fill="url(#glowPurple)">
    <animate attributeName="opacity" values="0.9;0.5;0.9" dur="6s" repeatCount="indefinite"/>
  </circle>

  <g opacity="0.75">
    <circle cx="320" cy="195" r="108" stroke="#22D3EE" stroke-opacity="0.45"/>
    <circle cx="320" cy="195" r="78" stroke="#64748B" stroke-opacity="0.3" stroke-dasharray="5 9">
      <animateTransform attributeName="transform" type="rotate" from="0 320 195" to="360 320 195" dur="22s" repeatCount="indefinite"/>
    </circle>
    <circle cx="895" cy="195" r="103" stroke="#8B5CF6" stroke-opacity="0.5"/>
    <circle cx="895" cy="195" r="73" stroke="#EC4899" stroke-opacity="0.28" stroke-dasharray="4 10">
      <animateTransform attributeName="transform" type="rotate" from="360 895 195" to="0 895 195" dur="18s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g>
    <circle r="8" fill="#22D3EE" filter="url(#softGlow)">
      <animateMotion dur="7s" repeatCount="indefinite"><mpath href="#leftOrbit"/></animateMotion>
    </circle>
    <circle r="5" fill="#67E8F9">
      <animateMotion dur="7s" repeatCount="indefinite"><mpath href="#leftOrbit"/></animateMotion>
    </circle>
    <circle r="8" fill="#EC4899" filter="url(#softGlow)">
      <animateMotion dur="9s" repeatCount="indefinite"><mpath href="#rightOrbit"/></animateMotion>
    </circle>
    <circle r="5" fill="#F9A8D4">
      <animateMotion dur="9s" repeatCount="indefinite"><mpath href="#rightOrbit"/></animateMotion>
    </circle>
  </g>

  <g stroke="#475569" stroke-opacity="0.35">
    <path d="M68 86L190 128L272 76"/>
    <path d="M936 88L1022 132L1136 78"/>
    <path d="M78 302L174 266L260 324"/>
    <path d="M944 308L1030 266L1132 316"/>
  </g>
  <g fill="#22D3EE">
    <circle cx="68" cy="86" r="4"><animate attributeName="r" values="3;7;3" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="190" cy="128" r="4"/>
    <circle cx="272" cy="76" r="4"/>
  </g>
  <g fill="#A78BFA">
    <circle cx="936" cy="88" r="4"/>
    <circle cx="1022" cy="132" r="4"><animate attributeName="r" values="3;7;3" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="1136" cy="78" r="4"/>
  </g>

  <g text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">
    <text x="600" y="136" fill="#94A3B8" font-size="17" letter-spacing="5">HELLO, I AM</text>
    <text x="600" y="202" fill="url(#accent)" font-size="48" font-weight="800" letter-spacing="2">AKSHAT X GUPTA</text>
    <text x="600" y="246" fill="#CBD5E1" font-size="19">SOFTWARE DEVELOPER  ·  BUILDER  ·  AI EXPLORER</text>
    <text x="600" y="298" fill="#64748B" font-size="15">ideas → systems → useful software</text>
  </g>

  <rect x="300" y="327" width="600" height="2" rx="1" fill="url(#accent)" opacity="0.8">
    <animate attributeName="x" values="300;430;300" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="width" values="600;340;600" dur="7s" repeatCount="indefinite"/>
  </rect>
</svg>
